# Two containers only: the app (internal, never published) and Caddy (HTTPS, the only public entry).
# Configuration comes from ./.env (see .env.example). Run: docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      TRUST_PROXY: "1" # exactly one proxy (Caddy) in front: client IPs for rate limiting come from it
      DB_PATH: /data/app.db
    volumes:
      - app-data:/data
    expose:
      - "3000" # reachable by Caddy on the internal network only; NOT published on the host
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    pids_limit: 256
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. agent.chiemgaufilms.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  internal:

volumes:
  app-data:
  caddy-data:
  caddy-config:
